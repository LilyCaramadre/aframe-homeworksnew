<!DOCTYPE html>
<html>
    <head> 
        <title>A Simple Scene</title> 
        <script src= 
            "https://aframe.io/releases/1.7.0/aframe.min.js"> 
        </script>
    </head>
        <body> 
            <a-scene>
                <a-assets>
                    <img id="tile-base" src="assets\Tiles_067_basecolor.png">
                    <img id="tile-ambient-occlusion" src="assets\Tiles_067_ambientOcclusion.png">
                    <img id="tile-normal" src="assets\Tiles_067_normal.png">
                </a-assets>
                <a-plane 
                    color="seagreen" 
                    position="0 0 0" 
                    rotation="-90 0 0" 
                    width="500" 
                    height="500" 
                    > 
                </a-plane> 
                <a-sky 
                    color="lightskyblue" 
                    > 
                </a-sky> 
                <a-mixin
                    id="wallcolor"
                    color="lightsteelblue"
                    >
                </a-mixin>
                <a-box
                    mixin="wallcolor"
                    position="0 1.5 -16"
                    rotation="0 0 0"
                    width="10"
                    height="3"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    mixin="wallcolor"
                    position="-5 1.5 -11"
                    rotation="0 90 0"
                    width="10"
                    height="3"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    mixin="wallcolor"
                    position="5 1.5 -11"
                    rotation="0 90 0"
                    width="10"
                    height="3"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    mixin="wallcolor"
                    position="-2.875 1.5 -6"
                    rotation="0 0 0"
                    width="4.25"
                    height="3"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    mixin="wallcolor"
                    position="2.875 1.5 -6"
                    rotation="0 0 0"
                    width="4.25"
                    height="3"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    mixin="wallcolor"
                    position="0 2.75 -6"
                    rotation="0 0 0"
                    width="1.5"
                    height="0.5"
                    depth="0.1"
                    >
                </a-box>
                <a-box
                    material= 
                    "src: #tile-base; 
                    repeat: 10 10; 
                    ambientOcclusionMap: #tile-ambient-occlusion; 
                    ambientOcclusionTextureRepeat: 10 10; 
                    normalMap: #tile-normal; 
                    normalTextureRepeat: 10 10"
                    position="0 0 -11"
                    width="10"
                    depth="10"
                    height="0.1"
                    >
                </a-box>
                <a-box
                    color="darkgray"
                    position="0 3 -11"
                    width="12"
                    depth="12"
                    height="0.25"
                    >
                </a-box>
                <a-box
                    color="darkgray"
                    position="0 .8 -11"
                    rotation="0 45 0"
                    width="1.5"
                    depth="4"
                    height="0.25"
                    >
                </a-box>
                <a-sphere
                    color="aliceblue"
                    position="0 3 -11"
                    radius=".5"
                    >
                </a-sphere>
                <a-cylinder
                    color="darkgray"
                    position="0 0 -11"
                    rotation="0 0 0"
                    radius=".2"
                    height="1.2"
                    >
                </a-cylinder>
                <a-cone
                    color="gray"
                    position="2 0 -14"
                    rotation="0 0 0"
                    radius-bottom="0.3"
                    height="3"
                    >
                </a-cone>
                <a-text
                    value="OPERATING ROOM"
                    color="black"
                    position="1.9 2 -5.9"
                    width="6"
                    >
                </a-text>
                <a-plane
                    color="black"
                    position="2 1.6 -14"
                    rotation="-30 -20 0"
                    width="2"
                    height="1"
                    >
                </a-plane>
                <a-box
                    color="gray"
                    position="4 0 -11.5"
                    rotation="0 0 0"
                    width="1"
                    depth="2"
                    height="2"
                    >
                </a-box>
                <a-cone
                    color="blue"
                    position="4 1.05 -11.5"
                    rotation="90 90 0"
                    radius-bottom="0.05"
                    height=".5"
                    >
                </a-cone>
                <a-cone
                    color="blue"
                    position="4 1.05 -11"
                    rotation="90 90 0"
                    radius-bottom="0.05"
                    height=".5"
                    >
                </a-cone>
                <a-cone
                    color="blue"
                    position="4 1.05 -12"
                    rotation="90 90 0"
                    radius-bottom="0.05"
                    height=".5"
                    >
                </a-cone>
                 <a-cylinder
                    color="aliceblue"
                    position="-3 2.8 -11"
                    rotation="0 0 0"
                    radius=".5"
                    height=".2"
                    >
                </a-cylinder>
                <a-cylinder
                    color="aliceblue"
                    position="-2.9 2.3 -11.1"
                    rotation="30 -30 10"
                    radius=".05"
                    height="1"
                    >
                </a-cylinder>
                <a-cylinder
                    color="aliceblue"
                    position="-2.6 1.9 -11.2"
                    rotation="45 -90 0"
                    radius=".5"
                    height=".1"
                    >
                </a-cylinder>
                <a-plane
                    color="black"
                    position="-4.9 1.6 -11"
                    rotation="0 90 0"
                    width="4"
                    height="1.8"
                    >
                </a-plane>
            </a-scene>
        </body>
</html>
